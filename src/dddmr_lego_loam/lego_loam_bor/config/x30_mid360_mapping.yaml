# Real-time X30 mapping with the four-Mid360 PointCloud2 output.
# The Livox driver publishes the merged cloud on /lidar_points.

lego_loam_ip:
  ros__parameters:
    use_sim_time: false
    laser:
      odom_type: "laser_odometry"
      base_ground_frame: "base_link"
      # /lidar_points currently exposes line values 0..15.
      num_vertical_scans: 16
      num_horizontal_scans: 1000
      vertical_angle_bottom: -7.0
      vertical_angle_top: 52.0
      scan_period: 0.1

    imageProjection:
      segment_valid_point_num: 5
      segment_valid_line_num: 2
      segment_theta: 60.0
      minimum_detection_range: 0.5
      maximum_detection_range: 100.0
      distance_for_patch_between_rings: 1.0
      # Mid360 is a non-repetitive lidar. This is the official baseline.
      stitcher_num: 1
      trt_model_path: ""
      projected_image_stack_size: 1
      patch_first_ring_to_baselink: true
      ground_slope_tolerance: 0.34
      ground_dz_tolerance: 0.1
      # Ground lies below the lidar in the current sensor frame.
      ground_fov_bottom: -0.2617994  # -15 deg
      ground_fov_top: 0.0872665      # +5 deg
      ground_positive_start: 0.0
      ground_positive_stop: 3.1415926
      ground_negative_start: 0.0
      ground_negative_stop: -3.1415926

lego_loam_fa:
  ros__parameters:
    use_sim_time: false
    featureAssociation:
      edge_threshold: 0.1
      surf_threshold: 0.1
      nearest_feature_search_distance: 3.0
    mapping:
      to_map_optimization: true

lego_loam_mo:
  ros__parameters:
    use_sim_time: false
    mapping:
      distance_between_key_frame: 0.5
      angle_between_key_frame: 0.5
      enable_loop_closure: true
      surrounding_keyframe_search_num: 20
      history_keyframe_search_radius: 30.0
      history_keyframe_search_num: 5
      history_keyframe_fitness_score: 0.5
      ground_voxel_size: 0.3
      ground_edge_threshold_num: 50

lego_loam_map_visualization:
  ros__parameters:
    use_sim_time: false
    ground_voxel_size: 0.3
    ground_edge_threshold_num: 50
